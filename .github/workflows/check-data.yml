name: Check data
on:
  push:
    paths: ['data.json', 'data.js']
  pull_request:
    paths: ['data.json', 'data.js']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: data.json is valid and data.js matches it
        run: |
          node -e "
          const fs=require('fs');
          const j=fs.readFileSync('data.json','utf8');
          const d=JSON.parse(j);
          for (const k of ['updated','teams','playin','swiss','ko']) if (!d[k]) throw new Error('missing '+k);
          const js=fs.readFileSync('data.js','utf8');
          if (js.trim() !== ('window.WORLDS_DATA = '+j+';').trim()) throw new Error('data.js is out of date: run sync-data.ps1');
          const keys=new Set(Object.keys(d.teams));
          for (const m of [...d.playin,...d.swiss,...d.ko]) for (const s of ['a','b']) if (m[s] && !keys.has(m[s])) throw new Error(m.id+' uses unknown team '+m[s]);
          console.log('ok');
          "
